packages:
  - apps/*
  - packages/*
  - tools/*
  - test/*

catalog:
  "@ant-design/icons": ^6.3.4
  "@types/node": ^24
  antd: ^6.6.6
  preact: ^11.0.1
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0

catalogMode: prefer
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
